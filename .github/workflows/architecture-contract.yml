name: Architecture Contract

on:
  push:
    branches: [main, "feat/**", "integration/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse policy and JSON Schema
        run: python -c "import json; json.load(open('.architecture/resilience-policy.json', encoding='utf-8')); json.load(open('.architecture/resilience-policy.schema.json', encoding='utf-8'))"
      - name: Validate resilience and trust invariants
        run: python scripts/validate_resilience_policy.py
      - name: Test policy validator and negative cases
        run: python -m unittest discover -s tests -p "test_resilience_policy.py" -v
