name: Unified BAV security gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bav-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Beelzebul 66-rule scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate and base history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate canonical Beelzebul policy and BAV report contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path("security/beelzebul.v1.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("schemas/beelzebul.security.v1.schema.json").read_text(encoding="utf-8"))
          report_schema = json.loads(Path("schemas/bav.security.report.v1.schema.json").read_text(encoding="utf-8"))
          packaged_policy = json.loads(Path("reaper/security/beelzebul.v1.json").read_text(encoding="utf-8"))
          assert policy == packaged_policy, "packaged BAV policy mirror drifted from the canonical repository policy"
          assert policy["schema"] == "beelzebul.security.v1"
          assert policy["rule_count"] == len(policy["rules"]) == 66
          assert schema["properties"]["rules"]["maxItems"] == 66
          assert report_schema["properties"]["schema"]["const"] == "bav.security.report.v1"
          PY
      - name: Run Beelzebul regression tests
        run: python3 -m unittest discover -s tests -p "test_beelzebul.py" -v
      - name: Compile Java Guard and run its self-test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bav-classes"
          javac --release 17 -proc:none -encoding UTF-8 -d "$RUNNER_TEMP/bav-classes" \
            reaper/java/src/main/java/org/ivanvhs/bav/Bav.java \
            tests/java/org/ivanvhs/bav/BavSelfTest.java
          java -Xms16m -Xmx256m -Dfile.encoding=UTF-8 \
            -cp "$RUNNER_TEMP/bav-classes" org.ivanvhs.bav.BavSelfTest
      - name: Run Reaper BAV adapter regression tests
        run: python3 -m unittest discover -s tests -p "test_bav.py" -v
      - name: Run object-capability authority tests
        run: python3 -m unittest discover -s tests -p "test_capabilities.py" -v
      - name: Run capability-enforced plugin host tests
        run: python3 -m unittest discover -s tests -p "test_plugins.py" -v
      - name: Verify Java Guard is included in the distributable wheel
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bav-wheel"
          python3 -m pip wheel --no-deps --no-build-isolation . --wheel-dir "$RUNNER_TEMP/bav-wheel"
          python3 - <<'PY'
          import glob
          import os
          import zipfile
          from pathlib import Path
          wheels = glob.glob(str(Path(os.environ["RUNNER_TEMP"]) / "bav-wheel" / "*.whl"))
          assert wheels, "wheel build did not produce a wheel"
          with zipfile.ZipFile(wheels[0]) as wheel:
              required = (
                  "reaper/java/src/main/java/org/ivanvhs/bav/Bav.java",
                  "reaper/security/beelzebul.py",
                  "reaper/security/beelzebul.v1.json",
              )
              names = set(wheel.namelist())
              for source in required:
                  assert source in names, f"{source} is missing from the wheel"
          PY
      - name: Run unified Java/Reaper BAV scan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$BASE_REF" ]; then ARGS+=(--base-ref "$BASE_REF"); fi
          python3 -m reaper security scan --root . --policy security/beelzebul.v1.json \
            --json --output "$RUNNER_TEMP/bav-report.json" "${ARGS[@]}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"] + "/bav-report.json").read_text(encoding="utf-8"))
          assert report["schema"] == "bav.security.report.v1"
          assert report["findings_count"] == len(report["findings"])
          assert set(report["components"]) == {"beelzebul", "java_guard"}
          assert report["scan"]["read_only"] is True
          assert report["scan"]["project_code_executed"] is False
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "# BAV Java/Reaper security scan\n\n"
              f"- Verdict: **{report['verdict']}**\n"
              f"- Risk score: **{report['risk_score']}/100**\n"
              f"- Beelzebul rules: **{report['components']['beelzebul']['rules_total']}**\n"
              f"- Java Guard rules: **{report['components']['java_guard']['rules_total']}**\n"
              f"- Findings: **{report['findings_count']}**\n"
              f"- Text files scanned: **{report['scan']['text_files_scanned']}**\n"
              "- Scan mode: **read-only; no project code execution**\n",
              encoding="utf-8",
          )
          PY
