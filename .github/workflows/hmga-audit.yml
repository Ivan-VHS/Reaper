name: HMGA repository audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit repository contract
        run: python tools/hmga_audit.py --strict
      - name: Test repository auditor
        run: python -m unittest discover -s tests -p "test_hmga_audit.py" -v
