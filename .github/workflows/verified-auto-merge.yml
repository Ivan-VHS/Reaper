name: Verified PR Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verified-auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  review-gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      pr_url: ${{ steps.gate.outputs.pr_url }}
      author: ${{ steps.gate.outputs.author }}
      draft: ${{ steps.gate.outputs.draft }}
    steps:
      - id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number;
            if (!number) throw new Error('Missing pull request context');
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number
            });
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number, per_page: 100
            });
            reviews.sort((a, b) => Date.parse(a.submitted_at || '') - Date.parse(b.submitted_at || ''));
            const latest = new Map();
            for (const r of reviews) {
              if (r.user?.login && r.user.login !== pr.user.login) latest.set(r.user.login, r);
            }
            const current = [...latest.values()].filter(r => r.commit_id === pr.head.sha);
            const approved = current.some(r => r.state === 'APPROVED');
            const changes = current.some(r => r.state === 'CHANGES_REQUESTED');
            const sameRepo = pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            core.setOutput('approved', String(pr.state === 'open' && !pr.draft && sameRepo && approved && !changes));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('pr_url', pr.html_url);
            core.setOutput('author', pr.user.login);
            core.setOutput('draft', String(pr.draft));

  cancel-stale-auto-merge:
    needs: review-gate
    if: needs.review-gate.outputs.approved != 'true' && needs.review-gate.outputs.draft != 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ needs.review-gate.outputs.pr_url }}
        run: |
          set -euo pipefail
          pending="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$pending" = "true" ]; then gh pr merge "$PR_URL" --disable-auto; fi

  validate-python:
    needs: review-gate
    if: needs.review-gate.outputs.approved == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.review-gate.outputs.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q reaper tests
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m reaper --check examples/flow.rpr
          python -m reaper examples/flow.rpr

  validate-native:
    needs: review-gate
    if: needs.review-gate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.review-gate.outputs.head_sha }}
          persist-credentials: false
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - name: Native CLI smoke test
        run: |
          ./build/reaper-c --version
          ./build/reaper-c --evolution-status
          ./build/reaper-c --tokens examples/hello.rpr

  wait-for-ci:
    needs: [review-gate, validate-python, validate-native]
    if: needs.review-gate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require all current repository checks to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ needs.review-gate.outputs.head_sha }}
          EXPECTED_CHECKS: '["Python 3.10","Python 3.11","Python 3.12","native-c","audit"]'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
            test "$head" = "$PR_HEAD_SHA" || { echo "PR head changed; stopping stale validation."; exit 1; }
            payload="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$PR_HEAD_SHA/check-runs?per_page=100")"
            summary="$(jq -c --arg run "$GITHUB_RUN_ID" --argjson expected "$EXPECTED_CHECKS" '
              [ .[].check_runs[]?
                | select(((.details_url // "") | contains("/actions/runs/" + $run + "/")) | not)
              ]
              | sort_by(.name, .started_at)
              | group_by(.name) | map(last) as $checks
              | {
                  pending: [$checks[] | select(.status != "completed")] | length,
                  failed: [$checks[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length,
                  missing: [$expected[] as $name | select([$checks[] | select(.name == $name and .status == "completed" and (.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped"))] | length == 0)] | length
                }
            ' <<< "$payload")"
            pending="$(jq -r '.pending' <<< "$summary")"
            failed="$(jq -r '.failed' <<< "$summary")"
            missing="$(jq -r '.missing' <<< "$summary")"
            echo "Checks: pending=$pending failed=$failed missing=$missing"
            if [ "$failed" -gt 0 ]; then echo "A repository check failed."; exit 1; fi
            if [ "$pending" -eq 0 ] && [ "$missing" -eq 0 ]; then echo "All current checks passed."; exit 0; fi
            sleep 30
          done
          echo "Timed out waiting for repository checks."
          exit 1

  enable-auto-merge:
    needs: [review-gate, validate-python, validate-native, wait-for-ci]
    if: needs.review-gate.outputs.approved == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Recheck head and independent review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ needs.review-gate.outputs.pr_url }}
          PR_AUTHOR: ${{ needs.review-gate.outputs.author }}
          PR_HEAD_SHA: ${{ needs.review-gate.outputs.head_sha }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          test "$head" = "$PR_HEAD_SHA" || { echo "PR head changed; refusing stale merge."; exit 1; }
          reviews="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews")"
          decision="$(jq -c --arg author "$PR_AUTHOR" --arg head "$PR_HEAD_SHA" '
            [.[][] | select(.user.login != $author)]
            | sort_by(.user.login, .submitted_at)
            | group_by(.user.login) | map(last) as $latest
            | {
                approvals: [$latest[] | select(.state == "APPROVED" and .commit_id == $head)] | length,
                changes: [$latest[] | select(.state == "CHANGES_REQUESTED" and .commit_id == $head)] | length
              }
          ' <<< "$reviews")"
          approvals="$(jq -r '.approvals' <<< "$decision")"
          changes="$(jq -r '.changes' <<< "$decision")"
          if [ "$approvals" -lt 1 ] || [ "$changes" -gt 0 ]; then
            echo "Independent approval is missing or a change request is active."
            exit 1
          fi
          gh pr merge "$PR_URL" --auto --squash --delete-branch
