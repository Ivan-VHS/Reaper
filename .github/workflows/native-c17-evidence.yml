name: Native C17 compiler evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: ["automation/verified-build-artifacts-2026-11-28"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reaper-native-c17-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-c17:
    name: Native C17 configure, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Configure native compiler and test targets
        run: cmake -S . -B build-native -DREAPER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Compile native compiler and ABI libraries
        run: cmake --build build-native --parallel 2
      - name: Execute native CTest suite
        run: ctest --test-dir build-native --output-on-failure --output-junit build-native/ctest-results.xml
      - name: Publish native executables, libraries and test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reaper-native-c17-linux
          if-no-files-found: warn
          path: |
            build-native/ctest-results.xml
            build-native/reaper-c
            build-native/libreaper*
