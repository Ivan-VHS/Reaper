name: Kora Python helpers

on:
  push:
    branches: [main, "feat/**", "refactor/**"]
    paths: ["reaper/kora/**", "tests/test_kora.py", "docs/KORA.md", ".github/workflows/kora-python-build.yml"]
  pull_request:
    paths: ["reaper/kora/**", "tests/test_kora.py", "docs/KORA.md", ".github/workflows/kora-python-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test Kora
        run: |
          python -m unittest tests.test_kora -v
          python -m compileall -q reaper/kora
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
