name: Reaper Native C
on:
  push:
    branches: [ "main", "rewrite/**", "feat/**" ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-c:
    name: Native C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C and Python toolchains
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3
      - name: Configure C17 build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build native core
        run: cmake --build build --parallel
      - name: Run native and toolchain tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke-test native CLI
        run: |
          ./build/reaper-c --version
          ./build/reaper-c --evolution-status
          ./build/reaper-c --tokens examples/hello.rpr
          ./build/reaper-c --eval "6 * 7"
          ./build/reaper-c --run examples/native_expression.rpr
          ./build/reaper-c --selfhood
          ./build/reaper-c --selfhood-token "Сам"
