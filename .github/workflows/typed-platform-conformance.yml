name: Reaper typed structure and platform conformance

on:
  push:
    branches: [main, "feat/**", "integration/**"]
    paths:
      - "selfhost/lexer.rpr"
      - "selfhost/program_parser.rpr"
      - "selfhost/type_declarations.rpr"
      - "selfhost/typed_declarations.rpr"
      - "selfhost/typed_declarations_tests.rpr"
      - "selfhost/typed_signature_tests.rpr"
      - "selfhost/typed_signatures.rpr"
      - "selfhost/type_platform.rpr"
      - "selfhost/type_platform_tests.rpr"
      - "examples/typed_platforms.rpr"
      - "docs/TYPED_STRUCTURES_AND_PLATFORMS_V1.md"
      - ".github/workflows/typed-platform-conformance.yml"
  pull_request:
    paths:
      - "selfhost/lexer.rpr"
      - "selfhost/program_parser.rpr"
      - "selfhost/type_declarations.rpr"
      - "selfhost/typed_declarations.rpr"
      - "selfhost/typed_declarations_tests.rpr"
      - "selfhost/type_platform.rpr"
      - "selfhost/type_platform_tests.rpr"
      - "examples/typed_platforms.rpr"
      - "docs/TYPED_STRUCTURES_AND_PLATFORMS_V1.md"
      - ".github/workflows/typed-platform-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reaper-source-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Reaper-written lexer declarations
        run: python -m reaper selfhost/lexer.rpr
      - name: Validate Reaper-written declaration parser
        run: python -m reaper selfhost/program_parser.rpr
      - name: Validate the unified declaration module and compatibility facade
        run: python -m reaper selfhost/type_declarations.rpr
      - name: Run end-to-end typed declaration conformance
        run: python -m reaper selfhost/typed_declarations_tests.rpr
      - name: Run target layout conformance
        run: python -m reaper selfhost/type_platform_tests.rpr
      - name: Run typed craft signature and Result/Option conformance
        run: python -m reaper selfhost/typed_signature_tests.rpr
      - name: Type-check the system-data example
        run: python -m reaper --check examples/typed_platforms.rpr
