name: Reaper CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package and tests
        run: python -m compileall -q reaper tests
      - name: Validate localized README links
        run: python .github/scripts/check_readme_links.py
      - name: Validate Duck Sovereign Canon palette
        run: python tools/validate_visual_canon.py reaper/ui_theme.py
      - name: Validate MOST 666 function registry
        run: python tools/validate_most_functions.py
      - name: Validate engineering evolution contract
        run: python tools/validate_engineering_evolution.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example
        run: python -m reaper --check examples/flow.rpr
      - name: Validate federated audit program
        run: python -m reaper --check examples/device_audit.rpr
      - name: Run example
        run: python -m reaper examples/flow.rpr
      - name: Run end-to-end read-only device audit example
        run: |
          python -m reaper examples/device_audit.rpr
          python -c "import json; report=json.load(open('device-audit-report.json', encoding='utf-8')); assert report['schema'] == 'reaper.oplage-comparison.v1'; assert report['mode'] == 'read_only'"

  freestanding-os:
    name: Freestanding x86_64 kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils
      - name: Test OS project manifest and compiler plan
        run: python -m unittest discover -s tests -p test_os_toolchain.py -v
      - name: Compile freestanding header for all configured targets
        run: |
          for target in x86_64-unknown-none-elf aarch64-unknown-none-elf riscv64-unknown-none-elf; do
            clang --target="$target" -std=c17 -ffreestanding -fno-builtin \
              -Wall -Wextra -Wpedantic -Werror -I include \
              -c tests/freestanding_header_smoke.c -o "/tmp/reaper-$target.o"
          done
      - name: Validate sample project
        run: python -m reaper os check freestanding/reaper-os.json
      - name: Build freestanding ELF
        run: python -m reaper os build freestanding/reaper-os.json
      - name: Verify ELF entry point
        run: |
          readelf -h freestanding/build/reaper-kernel.elf
          readelf -s freestanding/build/reaper-kernel.elf | grep -E 'GLOBAL.*_start'
