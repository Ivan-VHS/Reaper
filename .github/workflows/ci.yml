name: Reaper CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reaper-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  native-cross-repository-hardware:
    name: Native C17 + Pytyliki hardware bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned Pytyliki hardware provider
        uses: actions/checkout@v7.0.1
        with:
          repository: Ivan-VHS/Pytyliki
          ref: 5cca450f847312c7e01757bc1e9174a203a3dcce
          path: Pytyliki
          persist-credentials: false
      - name: Configure Pytyliki
        run: cmake -S Pytyliki -B Pytyliki/build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build Pytyliki provider and tests
        run: cmake --build Pytyliki/build --config Release --parallel
      - name: Test Pytyliki hardware collector, PPF and ABI
        run: ctest --test-dir Pytyliki/build -C Release --output-on-failure
      - name: Configure Reaper native C17 bridge
        run: >
          cmake -S . -B build-native
          -DREAPER_BUILD_TESTS=ON
          -DREAPER_ENABLE_PYTYLIKI_HARDWARE_BRIDGE=ON
          -DREAPER_PYTYLIKI_INCLUDE_DIR=${{ github.workspace }}/Pytyliki/src
          -DREAPER_PYTYLIKI_LIBRARY=${{ github.workspace }}/Pytyliki/build/libpytyliki_ffi.so
          -DCMAKE_BUILD_TYPE=Release
      - name: Build Reaper native importer, backend and live bridge
        run: cmake --build build-native --config Release --parallel
      - name: Test Reaper native compiler, backend and live Pytyliki bridge
        run: ctest --test-dir build-native -C Release --output-on-failure

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package and tests
        run: python -m compileall -q reaper tests
      - name: Validate localized README links
        run: python .github/scripts/check_readme_links.py
      - name: Validate every tracked Markdown document and local anchor
        run: python tools/validate_markdown_inventory.py
      - name: Test Markdown integrity validator
        run: python -m unittest discover -s tests -p "test_markdown_inventory.py" -v
      - name: Validate Duck Sovereign Canon palette
        run: python tools/validate_visual_canon.py reaper/ui_theme.py
      - name: Validate MOST function contract registry
        run: python tools/validate_most_functions.py
      - name: Validate engineering evolution contract
        run: python tools/validate_engineering_evolution.py

      - name: Test Jora and HARVEST source-pack integration
        run: python -m unittest tests.test_jora -v
      - name: Build wheel and verify bundled HARVEST pack
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python -c "import glob, zipfile; wheel=glob.glob('dist/*.whl'); assert len(wheel)==1; z=zipfile.ZipFile(wheel[0]); names=set(z.namelist()); chunks=[f'reaper/harvest_bundle/chunk-{i:03d}.b64' for i in range(1,17)]; missing=[name for name in chunks if name not in names]; assert not missing, f'HARVEST wheel data missing: {missing}'"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example
        run: python -m reaper --check examples/flow.rpr
      - name: Validate federated audit program
        run: python -m reaper --check examples/device_audit.rpr
      - name: Validate Reaper Typed Registry example
        run: python -m reaper --check examples/typed_registry.rpr
      - name: Run Reaper Typed Registry conformance fixtures
        run: python -m reaper examples/typed_registry.rpr
      - name: Validate Mora archive contracts example
        run: python -m reaper --check examples/mora_archive_contracts.rpr
      - name: Run Mora archive contract regression fixture
        run: python -m reaper examples/mora_archive_contracts.rpr
      - name: Run example
        run: python -m reaper examples/flow.rpr
      - name: Validate early-math invariant example
        run: python -m reaper --check examples/early_math.rpr
      - name: Run early-math invariant example
        run: python -m reaper examples/early_math.rpr
      - name: Run end-to-end read-only device audit example
        run: |
          python -m reaper examples/device_audit.rpr
          python -c "import json; report=json.load(open('device-audit-report.json', encoding='utf-8')); assert report['schema'] == 'reaper.oplage-comparison.v1'; assert report['mode'] == 'read_only'"
