name: Reaper CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package and tests
        run: python -m compileall -q reaper tests
      - name: Validate localized README links
        run: python .github/scripts/check_readme_links.py
      - name: Validate every tracked Markdown document and local anchor
        run: python tools/validate_markdown_inventory.py
      - name: Test Markdown integrity validator
        run: python -m unittest discover -s tests -p "test_markdown_inventory.py" -v
      - name: Validate Duck Sovereign Canon palette
        run: python tools/validate_visual_canon.py reaper/ui_theme.py
      - name: Validate MOST 666 function registry
        run: python tools/validate_most_functions.py
      - name: Validate engineering evolution contract
        run: python tools/validate_engineering_evolution.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example
        run: python -m reaper --check examples/flow.rpr
      - name: Validate federated audit program
        run: python -m reaper --check examples/device_audit.rpr
      - name: Validate Mora archive contracts example
        run: python -m reaper --check examples/mora_archive_contracts.rpr
      - name: Run Mora archive contract regression fixture
        run: python -m reaper examples/mora_archive_contracts.rpr
      - name: Run example
        run: python -m reaper examples/flow.rpr
      - name: Run end-to-end read-only device audit example
        run: |
          python -m reaper examples/device_audit.rpr
          python -c "import json; report=json.load(open('device-audit-report.json', encoding='utf-8')); assert report['schema'] == 'reaper.oplage-comparison.v1'; assert report['mode'] == 'read_only'"
      - name: Validate PLAGUE Reaper modules
        run: |
          python -m reaper --check plague/engine/core.rpr
          python -m reaper --check plague/engine/evolution.rpr
          python -m reaper --check plague/engine/policy.rpr
          python -m reaper --check plague/engine/registry.rpr
          python -m reaper --check plague/examples/policy_smoke.rpr
          python -m reaper --check plague/examples/evolution_smoke.rpr
      - name: Validate PLAGUE JSON contracts
        run: |
          python -m json.tool plague/manifest.v1.json > /dev/null
          python -m json.tool plague/policies/scope.v1.json > /dev/null
          python -m json.tool plague/schemas/repository-target.v1.schema.json > /dev/null
          python -m json.tool plague/schemas/change-plan.v1.schema.json > /dev/null
          python -m json.tool plague/schemas/evidence-bundle.v1.schema.json > /dev/null
          python -m json.tool plague/schemas/repository-profile.v1.schema.json > /dev/null
          python -m json.tool plague/schemas/evolution-proposal.v1.schema.json > /dev/null
      - name: Run PLAGUE host adapter tests
        run: |
          python -m unittest discover -s tests -p "test_plague_evolution.py" -v
          python -m unittest discover -s tests -p "test_plague_framework.py" -v
      - name: Run PLAGUE policy and registry smoke
        run: |
          python -m reaper plague/examples/policy_smoke.rpr | tee plague-smoke.log
          grep -F "PASS default mode is observe" plague-smoke.log
          grep -F "PASS observe can read source" plague-smoke.log
          grep -F "PASS propose cannot write a branch" plague-smoke.log
          grep -F "PASS apply can write a topic branch" plague-smoke.log
          grep -F "PASS default branch writes are denied" plague-smoke.log
          grep -F "PASS merge capability is disabled" plague-smoke.log
          grep -F "PASS release capability is disabled" plague-smoke.log
          grep -F "PASS scope expansion is denied" plague-smoke.log
          grep -F "PASS merge is denied" plague-smoke.log
          grep -F "PASS secret access is denied" plague-smoke.log
          grep -F "PASS untrusted execution is denied" plague-smoke.log
          grep -F "PASS unknown mode is denied" plague-smoke.log
          grep -F "PASS registry contains ten components" plague-smoke.log
          grep -F "PASS registry recognizes blightforge" plague-smoke.log

      - name: Run PLAGUE proposal assessment smoke
        run: |
          python -m reaper plague/examples/evolution_smoke.rpr | tee plague-evolution-smoke.log
          grep -Fx "PLAGUE_V1_OK" plague-evolution-smoke.log
