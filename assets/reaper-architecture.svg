<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="t d">
<title id="t">Reaper interpreter architecture</title><desc id="d">The Reaper source-to-runtime pipeline and an explicit effects boundary.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#101010"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#343434" stroke-width="1.5"/></marker></defs>
<rect width="1500" height="520" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial"><text x="60" y="62" fill="#FFFFFF" font-size="26" font-weight="700">FROM SOURCE TEXT TO EXPLICIT OUTPUT</text><text x="60" y="95" fill="#A3A3A3" font-size="17">Small language core · deterministic stages · bounded tree-walk execution</text></g>
<g transform="translate(55 155)" font-family="Segoe UI,Arial" text-anchor="middle">
<g><rect width="250" height="130" rx="16" fill="#fff" stroke="#343434" stroke-width="2"/><text x="125" y="48" fill="#FFD700" font-size="19" font-weight="700">SOURCE</text><text x="125" y="82" fill="#D8D8D8" font-size="16">.rpr program</text></g><path d="M256 65h46" stroke="#343434" stroke-width="3" marker-end="url(#arr)"/>
<g transform="translate(315)"><rect width="250" height="130" rx="16" fill="#fff" stroke="#343434" stroke-width="2"/><text x="125" y="48" fill="#FFD700" font-size="19" font-weight="700">LEXER</text><text x="125" y="82" fill="#D8D8D8" font-size="16">tokens + locations</text></g><path d="M571 65h46" stroke="#343434" stroke-width="3" marker-end="url(#arr)"/>
<g transform="translate(630)"><rect width="250" height="130" rx="16" fill="#fff" stroke="#343434" stroke-width="2"/><text x="125" y="48" fill="#FFD700" font-size="19" font-weight="700">PARSER</text><text x="125" y="82" fill="#D8D8D8" font-size="16">AST + syntax errors</text></g><path d="M886 65h46" stroke="#343434" stroke-width="3" marker-end="url(#arr)"/>
<g transform="translate(945)"><rect width="250" height="130" rx="16" fill="#fff" stroke="#343434" stroke-width="2"/><text x="125" y="48" fill="#FFD700" font-size="19" font-weight="700">RUNTIME</text><text x="125" y="82" fill="#D8D8D8" font-size="16">bounded tree-walk</text></g><path d="M1201 65h46" stroke="#343434" stroke-width="3" marker-end="url(#arr)"/>
<g transform="translate(1260)"><rect width="130" height="130" rx="16" fill="#181818" stroke="#FFD700" stroke-width="2"/><text x="65" y="48" fill="#FFE36E" font-size="18" font-weight="700">OUTPUT</text><text x="65" y="82" fill="#D8D8D8" font-size="15">console</text></g>
</g>
<g transform="translate(60 355)" font-family="Segoe UI,Arial"><rect width="1380" height="106" rx="16" fill="#fff" stroke="#FF7777" stroke-width="2"/><rect width="12" height="106" rx="6" fill="#FF7777"/><text x="40" y="42" fill="#B42332" font-size="19" font-weight="700">EXPLICIT EFFECTS BOUNDARY</text><text x="40" y="75" fill="#A3A3A3" font-size="17">Console I/O only through language operations such as emit / say / ask. No implicit filesystem, network, shell, process or hardware access.</text></g>
</svg>