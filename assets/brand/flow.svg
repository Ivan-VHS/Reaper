<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"><rect width="1200" height="300" rx="24" fill="#100b25"/><text x="48" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#f5f3ff">LEFT-TO-RIGHT VALUE COMPOSITION</text><g font-family="Consolas,monospace" text-anchor="middle"><rect x="45" y="105" width="220" height="100" rx="15" fill="#312e81" stroke="#a78bfa" stroke-width="2"/><text x="155" y="145" font-size="22" fill="white">[1, 2, 3, 4]</text><text x="155" y="177" font-size="14" fill="#ddd6fe">input value</text><text x="300" y="165" font-size="34" fill="#67e8f9">~&gt;</text><rect x="345" y="105" width="205" height="100" rx="15" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/><text x="447" y="145" font-size="22" fill="white">map(double)</text><text x="447" y="177" font-size="14" fill="#ddd6fe">transform</text><text x="585" y="165" font-size="34" fill="#67e8f9">~&gt;</text><rect x="630" y="105" width="205" height="100" rx="15" fill="#164e63" stroke="#22d3ee" stroke-width="2"/><text x="732" y="145" font-size="22" fill="white">keep(test)</text><text x="732" y="177" font-size="14" fill="#cffafe">filter</text><text x="870" y="165" font-size="34" fill="#67e8f9">~&gt;</text><rect x="915" y="105" width="235" height="100" rx="15" fill="#155e75" stroke="#22d3ee" stroke-width="2"/><text x="1032" y="145" font-size="22" fill="white">fold(0, add)</text><text x="1032" y="177" font-size="14" fill="#cffafe">reduce</text></g><text x="600" y="260" text-anchor="middle" font-family="Arial" font-size="17" fill="#c4b5fd">The left value becomes the first argument of the next operation.</text></svg>