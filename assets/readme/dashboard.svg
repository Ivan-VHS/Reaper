  <circle cx="30" cy="169" r="5" fill="#79B8FF"/>
  <path d="M43 169H104" stroke="#79B8FF" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <text x="200" y="173" class="micro" text-anchor="end">02</text>
