<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">Reaper — project visual overview</title>
<desc id="desc">Original vector overview of the actual Reaper workflow and implementation boundaries.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".55" stop-color="#101010"/><stop offset="1" stop-color="#181818"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#FFD700" stop-opacity=".22"/><stop offset="1" stop-color="#FFD700" stop-opacity="0"/></radialGradient>
 <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFD700"/><stop offset=".52" stop-color="#79B8FF"/><stop offset="1" stop-color="#6EDAA3"/></linearGradient>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/></pattern>
 <style>
 .eyebrow{font:600 11px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2.3px;fill:#FFD700}
 .brand{font:750 72px Inter,Segoe UI,Arial,sans-serif;letter-spacing:-2.7px;fill:#FFFFFF}
 .tagline{font:600 15px Inter,Segoe UI,Arial,sans-serif;letter-spacing:2.1px;fill:#D8D8D8}
 .body{font:400 13px Inter,Segoe UI,Arial,sans-serif;fill:#A3A3A3}
 .pill{font:600 10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.4px;fill:#D8D8D8}
 .stage{font:700 10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.7px;fill:#A3A3A3}
 .cardTitle{font:650 17px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF}
 .cardSub{font:450 11px Inter,Segoe UI,Arial,sans-serif;fill:#A3A3A3}
 .micro{font:600 9px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.3px;fill:#A3A3A3}
 </style>
</defs>
<rect width="1440" height="500" rx="28" fill="url(#bg)"/>
<rect width="1440" height="500" rx="28" fill="url(#grid)"/>
<circle cx="455" cy="110" r="360" fill="url(#halo)"/>
<circle cx="1245" cy="228" r="300" fill="url(#halo)" opacity=".4"/>
<path d="M0 398C210 327 380 467 570 388S1010 353 1440 425" fill="none" stroke="url(#rail)" stroke-width="1.5" opacity=".26"/>
<path d="M0 410C210 339 380 479 570 400S1010 365 1440 437" fill="none" stroke="url(#rail)" stroke-width="1" opacity=".13"/>
<rect x="58" y="64" width="4" height="290" rx="2" fill="url(#rail)"/>
<text x="88" y="103" class="eyebrow">LANGUAGE CORE  /  STUDIO  /  LANGUAGE SERVICES</text>
<text x="82" y="196" class="brand">Reaper</text>
<text x="88" y="237" class="tagline">FLOW-FIRST PROGRAMMING LANGUAGE</text>
<text x="88" y="282" class="body">A practical view of the product pipeline</text>
<text x="88" y="303" class="body">— not a mock interface or a hosted demo.</text>
<rect x="88" y="332" width="176" height="32" rx="16" fill="#181818" stroke="#454545"/>
<circle cx="106" cy="348" r="4" fill="#79B8FF"/>
<text x="120" y="352" class="pill">REAL IMPLEMENTATION</text>
<text x="88" y="431" class="eyebrow">SYSTEM MAP / 2026</text>
<text x="88" y="452" class="micro">ACTUAL MODULES • VERIFIED DATA FLOW</text>
