  <rect width="220" height="190" rx="20" fill="#181818" stroke="#343434" stroke-width="1.2"/>
  <rect x="20" y="20" width="34" height="4" rx="2" fill="#6EDAA3"/>
  <text x="20" y="55" class="stage">INTEGRATE</text>
  <text x="20" y="91" class="cardTitle">LSP • DAP</text>
