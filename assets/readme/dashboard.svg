<g stroke="#FFD700" stroke-width="2.2" fill="none" opacity=".9"><path d="M882 259H896"/><path d="M890 253L896 259L890 265"/></g><g stroke="#FFD700" stroke-width="2.2" fill="none" opacity=".9"><path d="M1122 259H1136"/><path d="M1130 253L1136 259L1130 265"/></g>
