[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "reaper-lang"
version = "0.1.0"
description = "Reaper: an experimental low-level systems language, native C17 compiler track, and hardware development workbench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ivan-VHS" }]
keywords = ["systems-programming", "embedded", "firmware", "hardware", "compiler", "native-code", "mmio", "qcs", "interpreter", "dataflow"]
classifiers = ["Development Status :: 3 - Alpha","Environment :: Console","Intended Audience :: Developers","License :: OSI Approved :: Apache Software License","Programming Language :: Python :: 3","Programming Language :: Python :: 3.10","Programming Language :: Python :: 3.11","Programming Language :: Python :: 3.12","Topic :: Software Development :: Interpreters","Topic :: Software Development :: Compilers"]
[project.scripts]
reaper = "reaper.cli:main"
reaper-lsp = "reaper.lsp:serve"
reaper-dap = "reaper.dap:serve"
reaper-qcs = "reaper.qcs:main"
reaper-polyglot = "reaper.polyglot:main"
reaper-polyglot-code = "reaper.polyglot_code:main"
reaper-embedded = "reaper.embedded:main"
reaper-noo-tah = "reaper.noo_tah:main"
reaper-toolchain = "reaper.toolchain_inventory:main"
reaper-duckos-audit = "reaper.duckos_bridge:main"
reaper-oplage-gpu-audit = "reaper.gpu_telemetry:main"
reaper-ventusample-pack-compare = "reaper.ventusample:main"
[project.gui-scripts]
reaper-studio = "reaper.desktop:main"
[tool.setuptools]
packages = ["reaper", "reaper.kora"]
[tool.setuptools.package-data]
"reaper" = ["systems_architectures.json", "systems_languages.json", "token_catalog.json", "atomic_quantum_catalogue.v1.json", "ventusample_pack.v1.schema.json"]
"reaper.kora" = ["manifest.json"]
