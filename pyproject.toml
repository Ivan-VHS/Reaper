[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reaper-lang"
version = "0.1.0"
description = "Reaper: a small, flow-first programming language and interpreter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Reaper contributors" }]
keywords = ["programming-language", "interpreter", "dataflow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Interpreters",
]

[project.scripts]
reaper = "reaper.cli:main"
reaper-polyglot = "reaper.polyglot:main"
reaper-polyglot-code = "reaper.polyglot_code:main"
reaper-embedded = "reaper.embedded:main"

[project.gui-scripts]
reaper-studio = "reaper.desktop:main"

[tool.setuptools]
packages = ["reaper"]

[tool.setuptools.package-data]
reaper = ["systems_architectures.json", "systems_languages.json", "token_catalog.json"]
